<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bursa Watchlist</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"
  integrity="sha384-JZigAjwiaZtkUbA44CWkPaT3iBb/mU5pO6QOANp+OqHd4q+1+7MG1kzp2OOP9ZfP" crossorigin="anonymous"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bursa Watchlist</h1>
    <p id="gen"></p>
  </header>
  <div class="card" id="market"></div>
  <div class="card">
    <table class="overview">
      <thead><tr><th>Stock</th><th>Price (RM)</th><th>Day</th><th>Rating</th><th class="hide-sm">Trend</th><th class="hide-sm">Valuation</th></tr></thead>
      <tbody id="ov"></tbody>
    </table>
  </div>
  <div id="stocks"></div>
  <div class="card" id="reports"></div>
  <p class="disclaimer">Signals are generated by rules from price and fundamental data (Yahoo Finance) for research only.
    They are not financial advice. Check Bursa announcements and the company's own reports before investing.</p>
</div>
<script src="common.js"></script>
<script src="chat.js"></script>
<script>
const DATA = __DATA__;
const REPORTS = Object.fromEntries((DATA.reports || []).map((r) => [r.code, r]));
const aiOff = `<p class="empty">AI brief is off: no Gemini key found. It runs in the GitHub cloud run once the key is added.</p>`;

$("#gen").textContent = `Updated ${DATA.generated} · prices as of ${DATA.stocks[0]?.as_of ?? "–"}`;

$("#ov").innerHTML = DATA.stocks.map((s) => `
  <tr onclick="document.getElementById('s-${s.code}').scrollIntoView({behavior:'smooth'})">
    <td><b>${esc(s.short)}</b> <span class="sub">${s.code}</span></td>
    <td>${fmt(s.close)}</td>
    <td class="${s.change_pct >= 0 ? "up" : "down"}">${sign(s.change_pct)}</td>
    <td><span class="badge ${s.rating}">${s.rating}</span></td>
    <td class="hide-sm"><span class="badge ${s.trend.label}">${s.trend.label}</span></td>
    <td class="hide-sm"><span class="badge ${s.valuation.label}">${s.valuation.label}</span></td>
  </tr>`).join("");

const M = DATA.market;
$("#market").innerHTML = `
  <h2 class="section-title">Market backdrop</h2>
  ${M.brief ? `<div class="brief"><p class="lead">${esc(M.brief.headline)}</p>${bullets(M.brief.points)}
      ${M.brief.portfolio?.length ? `<p class="k">Your stocks</p><ul>${M.brief.portfolio.map((p) => `<li><b>${esc(p.short)}</b>: ${esc(p.note)}</li>`).join("")}</ul>` : ""}
      <div class="tag">AI summary · ${esc(M.brief.model)}</div></div>`
    : DATA.ai_enabled ? `<p class="empty">AI market brief failed this run.</p>` : aiOff}
  <table style="margin-top:14px"><thead><tr><th>Indicator</th><th>Last</th><th>1 day</th><th>1 month</th><th class="hide-sm">3 months</th></tr></thead><tbody>
    ${M.indicators.map((m) => `<tr><td>${esc(m.label)}</td><td>${fmt(m.last, 2)}</td><td>${chg(m.d1)}</td><td>${chg(m.m1)}</td><td class="hide-sm">${chg(m.m3)}</td></tr>`).join("")}
  </tbody></table>
  <details><summary>Market headlines (last 3 days)</summary>${newsList(M.news)}</details>
  <div id="chat-market"></div>`;

const stockBrief = (b) => !b ? (DATA.ai_enabled ? `<p class="empty">AI brief failed for this stock this run.</p>` : aiOff) : `
  <div class="brief">
    <p class="lead">${esc(b.headline)}</p>
    <p><span class="k">AI view:</span> <span class="badge ${esc(b.stance)}">${esc(b.stance)}</span> ${esc(b.stance_reason)}</p>
    ${b.what_changed?.length ? `<p class="k">What changed</p>${bullets(b.what_changed)}` : ""}
    <p><span class="k">Drivers:</span> ${esc(b.drivers)}</p>
    <p><span class="k">Entry plan:</span> ${esc(b.entry_plan)}</p>
    <div class="grid" style="margin-top:0">
      <div><p class="k">Risks</p>${bullets(b.risks)}</div>
      <div><p class="k">Watch next</p>${bullets(b.watch_next)}</div>
    </div>
    <div class="tag">AI summary · ${esc(b.model)}</div>
  </div>`;

$("#stocks").innerHTML = DATA.stocks.map((s) => {
  const L = s.levels, F = s.fundamentals, I = s.indicators;
  const annual = s.annual.filter((a) => a.revenue != null || a.net_income != null);
  const rep = REPORTS[s.code];
  return `
  <section class="card" id="s-${s.code}">
    <div class="stock-head">
      <h2>${esc(s.name)} <span class="sub">${esc(s.short)} · ${s.code}</span></h2>
      <span class="price">RM ${fmt(s.close)}</span>
      <span class="${s.change_pct >= 0 ? "up" : "down"}">${sign(s.change_pct)}</span>
      <span class="badge ${s.rating}">${s.rating}</span>
    </div>
    <div class="sub">${esc(s.sector)} · ${esc(s.industry)} · Market cap RM ${big(F.market_cap)}</div>
    ${rep ? `<p style="margin:10px 0 0"><a class="link" href="report.html?code=${s.code}">Full deep-dive report →</a> <span class="sub">${esc(rep.generated)}</span></p>` : ""}
    ${stockBrief(s.brief)}
    <div class="chart" id="c-${s.code}"></div>
    ${CHART_LEGEND}
    <div class="grid">
      <div><h3>Trend & momentum <span class="badge ${s.trend.label}">${s.trend.label}</span></h3>${reasons(s.trend.reasons)}</div>
      <div><h3>Valuation <span class="badge ${s.valuation.label}">${s.valuation.label}</span></h3>${reasons(s.valuation.reasons)}</div>
    </div>
    <div class="grid">
      <div><h3>Key levels (RM)</h3><table>
        <tr><td>3-month resistance</td><td>${fmt(L.resistance_3m)}</td></tr>
        <tr><td>3-month support</td><td>${fmt(L.support_3m)}</td></tr>
        <tr><td>50-day average</td><td>${fmt(L.sma50)}</td></tr>
        <tr><td>200-day average</td><td>${fmt(L.sma200)}</td></tr>
        <tr><td>52-week range</td><td>${fmt(L.low_52w)} – ${fmt(L.high_52w)}</td></tr>
      </table></div>
      <div><h3>Fundamentals</h3><table>
        <tr><td>P/E (trailing)</td><td>${fmt(F.pe, 1)}</td></tr>
        <tr><td>P/B</td><td>${fmt(F.pb, 2)}</td></tr>
        <tr><td>Dividend yield</td><td>${F.dividend_yield ? fmt(F.dividend_yield, 2) + "%" : "–"}</td></tr>
        <tr><td>ROE</td><td>${pct(F.roe)}</td></tr>
        <tr><td>Profit margin</td><td>${pct(F.profit_margin)}</td></tr>
        <tr><td>Debt / equity</td><td>${F.debt_to_equity == null ? "–" : fmt(F.debt_to_equity, 0) + "%"}</td></tr>
        <tr><td>RSI (14) · Volume vs 20d</td><td>${fmt(I.rsi, 0)} · ${fmt(I.vol_ratio, 1)}×</td></tr>
      </table></div>
    </div>
    <div class="grid">
      <div><h3>External drivers (1 month)</h3><table>
        ${s.drivers.map((d) => `<tr><td>${esc(d.label)}<div class="sub">${esc(d.why)}</div></td><td>${chg(d.m1)}</td>
          <td>${d.impact ? `<span class="badge ${d.impact}">${d.impact}</span>` : "–"}</td></tr>`).join("")}
      </table></div>
      <div><h3>Recent news (30 days)</h3>${newsList(s.news)}</div>
    </div>
    ${annual.length ? `<h3 style="margin-top:18px">Annual results (RM)</h3><table>
      <tr><th>Year</th><th>Revenue</th><th>Net income</th></tr>
      ${annual.map((a) => `<tr><td>${a.year}</td><td>${big(a.revenue)}</td><td class="${a.net_income < 0 ? "down" : ""}">${big(a.net_income)}</td></tr>`).join("")}
    </table>` : ""}
    ${s.summary ? `<details><summary>About the business</summary><p>${esc(s.summary)}</p></details>` : ""}
    <div id="chat-${s.code}"></div>
  </section>`;
}).join("");

const reps = DATA.reports || [];
$("#reports").innerHTML = `
  <h2 class="section-title">Deep-dive reports</h2>
  ${reps.length ? `<table><thead><tr><th>Company</th><th>AI verdict</th><th class="hide-sm">Updated</th></tr></thead><tbody>
    ${reps.map((r) => `<tr><td><a class="link" href="report.html?code=${esc(r.code)}">${esc(r.short)}</a> <span class="sub">${esc(r.code)} · ${esc(r.name)}</span></td>
      <td>${r.stance ? `<span class="badge ${esc(r.stance)}">${esc(r.stance)}</span>` : "–"}</td><td class="hide-sm sub">${esc(r.generated)}</td></tr>`).join("")}
  </tbody></table>` : `<p class="empty">No deep-dive reports yet.</p>`}
  ${DATA.repo ? `<p class="sub" style="margin-top:12px">Want a report on any Bursa company?
    <a class="link" href="https://github.com/${esc(DATA.repo)}/actions/workflows/deepdive.yml" target="_blank" rel="noopener">Request a deep-dive →</a>
    Click <b>Run workflow</b>, type the stock code, and the report appears here in about 10–15 minutes.
    Watchlist reports refresh every Saturday.</p>` : ""}`;

DATA.stocks.forEach((s) => {
  drawChart(document.getElementById(`c-${s.code}`), s);
  StockChat.mount(document.getElementById(`chat-${s.code}`), {
    name: s.short,
    data: forAI(s),
    suggestions: ["Explain the latest results simply", "Who are its main competitors?", "What would make this a buy?"],
  });
});

StockChat.mount($("#chat-market"), {
  name: "the market and my portfolio",
  data: { market: M, portfolio: DATA.stocks.map((s) => ({ short: s.short, name: s.name, rating: s.rating, close: s.close, brief: s.brief })) },
  suggestions: ["What matters most for my stocks today?", "How does high oil affect Bursa?"],
});
</script>
</body>
</html>
