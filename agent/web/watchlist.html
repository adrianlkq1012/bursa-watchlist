<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Watchlist</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"
  integrity="sha384-JZigAjwiaZtkUbA44CWkPaT3iBb/mU5pO6QOANp+OqHd4q+1+7MG1kzp2OOP9ZfP" crossorigin="anonymous"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>My Watchlist</h1>
    <p id="gen" class="sub"></p>
  </header>
  <div class="card" id="market"></div>
  <div class="card">
    <table class="overview">
      <thead><tr><th>Stock</th><th>Price (RM)</th><th>Day</th><th>Rating</th><th class="hide-sm">Setup</th><th></th></tr></thead>
      <tbody id="ov"></tbody>
    </table>
    <div class="live" style="margin-top:8px"></div>
  </div>
  <div id="stocks"></div>
  <div class="card owner" id="owner"></div>
  <p class="disclaimer">Signals are generated by rules from price and fundamental data (Yahoo Finance) for research only.
    They are not financial advice. Check Bursa announcements and the company's own reports before investing.</p>
</div>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="signals.js"></script>
<script src="trading.js"></script>
<script src="chat.js"></script>
<script>
mountNav("watchlist");
// From the evening build: market backdrop, plus AI briefs / drivers / news for the owner's list
const DATA = __DATA__;
const BRIEFS = DATA.briefs || {};
const REPORTS = Object.fromEntries((DATA.reports || []).map((r) => [r.code, r]));
const live = {}; // code -> stock data fetched on demand

$("#gen").textContent = `AI briefs updated ${DATA.generated}. Prices update every minute while Bursa is open.`;

const M = DATA.market;
$("#market").innerHTML = `
  <h2 class="section-title">Market backdrop</h2>
  ${M.brief ? `<div class="brief"><p class="lead">${esc(M.brief.headline)}</p>${bullets(M.brief.points)}
      ${M.brief.portfolio?.length ? `<p class="k">Stocks covered</p><ul>${M.brief.portfolio.map((p) => `<li><b>${esc(p.short)}</b>: ${esc(p.note)}</li>`).join("")}</ul>` : ""}
      <div class="tag">AI summary · ${esc(M.brief.model)}</div></div>` : ""}
  <table style="margin-top:14px"><thead><tr><th>Indicator</th><th>Last</th><th>1 day</th><th>1 month</th><th class="hide-sm">3 months</th></tr></thead><tbody>
    ${M.indicators.map((m) => `<tr><td>${esc(m.label)}</td><td>${fmt(m.last, 2)}</td><td>${chg(m.d1)}</td><td>${chg(m.m1)}</td><td class="hide-sm">${chg(m.m3)}</td></tr>`).join("")}
  </tbody></table>
  <details><summary>Market headlines (last 3 days)</summary>${newsList(M.news)}</details>
  <div id="chat-market"></div>`;

const stockBrief = (code) => {
  const b = BRIEFS[code]?.brief;
  if (!b) return `<div class="brief"><p class="empty" style="margin:0">${Watch.isOwner()
    ? "Daily AI brief for this stock starts with tonight's 6:30pm update."
    : "Daily AI briefs cover the site owner's list. Ask the AI below about this stock anytime."}</p></div>`;
  return `
  <div class="brief">
    <p class="lead">${esc(b.headline)}</p>
    <p><span class="k">AI view:</span> <span class="badge ${esc(b.stance)}">${esc(b.stance)}</span> ${esc(b.stance_reason)}</p>
    ${b.what_changed?.length ? `<p class="k">What changed</p>${bullets(b.what_changed)}` : ""}
    <p><span class="k">Drivers:</span> ${esc(b.drivers)}</p>
    <p><span class="k">Entry plan:</span> ${esc(b.entry_plan)}</p>
    <div class="grid" style="margin-top:0">
      <div><p class="k">Risks</p>${bullets(b.risks)}</div>
      <div><p class="k">Watch next</p>${bullets(b.watch_next)}</div>
    </div>
    <div class="tag">AI summary · ${esc(b.model)} · ${esc(DATA.generated)}</div>
  </div>`;
};

function setupLine(sw) {
  if (!sw) return "";
  const p = sw.plan;
  return `<div class="brief" style="border-left-color:${p.bias === "Bullish" ? "var(--pos)" : p.bias === "Bearish" ? "var(--neg)" : "var(--neu)"}">
    <p style="margin:0"><span class="k">Swing setup:</span> <b>${esc(p.name)}</b> <span class="sub">(${esc(sw.trend)})</span></p>
    <p style="margin:6px 0 0">Entry <b>${fmt(p.entry)}</b> · Stop <b class="down">${fmt(p.stop)}</b> · Target <b class="up">${fmt(p.tp1)}</b>
      · Reward : risk <b class="${p.good ? "up" : "down"}">${p.rr.toFixed(1)}:1</b>${p.good ? "" : " <span class='sub'>(weak, most would skip)</span>"}</p>
  </div>`;
}

function card(s) {
  const F = s.fundamentals, B = BRIEFS[s.code], rep = REPORTS[s.code];
  return `
  <section class="card" id="s-${s.code}">
    <div class="stock-head">
      <h2><a class="stock" href="stock.html?code=${s.code}">${esc(s.name)}</a> <span class="sub">${esc(s.short)} · ${s.code}</span></h2>
      <span class="price" data-px="${s.code}" data-prefix="RM ">RM ${fmt(s.close)}</span>
      <span data-chg="${s.code}">${chg(s.change_pct)}</span>
      <span class="badge ${s.rating}">${s.rating}</span>
      ${Watch.star(s.code)}
    </div>
    <div class="sub">${[s.sector, s.industry].filter(Boolean).map(esc).join(" · ")} · Market cap RM ${big(F.market_cap)}</div>
    <p style="margin:10px 0 0"><a class="link" href="stock.html?code=${s.code}#trade">Full trading setup & backtest →</a>
      ${rep ? `&nbsp; <a class="link" href="stock.html?code=${s.code}">Deep-dive report →</a>` : ""}</p>
    ${stockBrief(s.code)}
    ${setupLine(s.swing)}
    <div class="chart" id="c-${s.code}"></div>
    ${CHART_LEGEND}
    <div class="grid">
      <div><h3>Trend & momentum ${s.trend ? `<span class="badge ${s.trend.label}">${s.trend.label}</span>` : ""}</h3>${s.trend ? reasons(s.trend.reasons) : `<p class="empty">Not enough history.</p>`}</div>
      <div><h3>Valuation <span class="badge ${s.valuation.label}">${s.valuation.label}</span></h3>${reasons(s.valuation.reasons)}</div>
    </div>
    <div class="grid">
      ${B?.drivers?.length ? `<div><h3>External drivers (1 month)</h3><table>
        ${B.drivers.map((d) => `<tr><td>${esc(d.label)}<div class="sub">${esc(d.why)}</div></td><td>${chg(d.m1)}</td>
          <td>${d.impact ? `<span class="badge ${d.impact}">${d.impact}</span>` : "–"}</td></tr>`).join("")}
      </table></div>` : ""}
      <div><h3>Recent news</h3><div id="news-${s.code}">${B?.news?.length ? newsList(B.news) : `<p class="empty">Loading…</p>`}</div></div>
    </div>
    <div id="chat-${s.code}"></div>
  </section>`;
}

// Fetch one stock live and work out its signals and swing setup
function fetchStock(code) {
  if (live[code]) return Promise.resolve(live[code]);
  return relay(`/stock/${code}`).then((d) => {
    const s = { ...d, ...analyse(d.candles, d.volumes, d.fundamentals) };
    try { s.swing = swingSetup(d.candles, d.volumes); } catch { s.swing = null; }
    return live[code] = s;
  });
}

async function render() {
  const codes = await Watch.load();
  $("#ov").innerHTML = codes.length ? codes.map((c) => `
    <tr id="ov-${c}" onclick="if (!event.target.closest('.star')) document.getElementById('s-${c}')?.scrollIntoView({behavior:'smooth'})">
      <td><b>${c}</b></td><td data-px="${c}">…</td><td data-chg="${c}"></td><td></td><td class="hide-sm"></td><td>${Watch.star(c)}</td></tr>`).join("")
    : `<tr><td colspan="6" class="empty">Your watchlist is empty. Search for a stock above and tap <b>☆ Watch</b> to add it.</td></tr>`;
  $("#stocks").innerHTML = codes.map((c) => `<section class="card" id="s-${c}"><p class="empty">Loading ${c}…</p></section>`).join("");
  Watch.paintAll();
  liveCells(codes);

  await Promise.all(codes.map((c) => fetchStock(c).then((s) => {
    $(`#ov-${c}`).innerHTML = `
      <td><b>${esc(s.short)}</b> <span class="sub">${c}</span></td>
      <td data-px="${c}">${fmt(s.close)}</td><td data-chg="${c}">${chg(s.change_pct)}</td>
      <td><span class="badge ${s.rating}">${s.rating}</span></td>
      <td class="hide-sm sub">${s.swing ? esc(s.swing.plan.name) : "–"}</td><td>${Watch.star(c)}</td>`;
    const el = $(`#s-${c}`);
    el.outerHTML = card(s);
    const sr = s.swing ? [...s.swing.supports.slice(0, 1), ...s.swing.resistances.slice(0, 1)]
      .map((l) => ({ price: l.price, color: "#8a94a0", dashed: true, title: l.type === "support" ? "S" : "R" })) : [];
    drawChart($(`#c-${c}`), s, { lines: sr });
    Watch.paintAll();
    if (!BRIEFS[c]?.news?.length) {
      const q = '"' + s.name.replace(/\s+(Berhad|Bhd\.?)$/i, "") + '"';
      relay(`/news?q=${encodeURIComponent(q)}`).then((n) => { $(`#news-${c}`).innerHTML = newsList(n.slice(0, 8)); })
        .catch(() => { $(`#news-${c}`).innerHTML = `<p class="empty">News unavailable right now.</p>`; });
    }
    StockChat.mount($(`#chat-${c}`), {
      name: s.short,
      data: () => ({ ...forAI(s), brief: BRIEFS[c]?.brief, swing_setup: s.swing?.plan }),
      suggestions: ["Explain the latest results simply", "Is the swing setup worth taking?", "What would make this a buy?"],
    });
  }).catch((e) => {
    $(`#s-${c}`).innerHTML = `<div class="stock-head"><h2>${c}</h2>${Watch.star(c)}</div><p class="empty">Couldn't load ${c} (${esc(e.message)}).</p>`;
    Watch.paintAll();
  })));
}

// Removing a stock takes its card away; adding one (from a stock page) shows on next visit
Watch.onChange((codes) => {
  document.querySelectorAll("#stocks > section").forEach((el) => { if (!codes.includes(el.id.slice(2))) el.remove(); });
  document.querySelectorAll("#ov tr[id]").forEach((el) => { if (!codes.includes(el.id.slice(3))) el.remove(); });
  renderOwner();
});

function renderOwner() {
  const owner = Watch.isOwner(), claimed = Watch.claimed();
  $("#owner").innerHTML = owner ? `
    <p style="margin:0">🔓 <b>Owner mode.</b> This list is saved online and syncs across all your devices. It also decides which stocks get the daily AI briefs and Saturday deep-dives.
      <button class="link-btn" id="lock" type="button">Lock this device</button></p>`
    : claimed ? `
    <p style="margin:0">This watchlist is saved <b>on this device only</b>. Add or remove stocks freely; it won't affect anyone else.
      <button class="link-btn" id="clear" type="button">Clear my list</button></p>
    <details><summary>Site owner? Unlock to edit your synced list</summary>
      <form id="unlock"><input type="password" placeholder="Owner passcode" autocomplete="current-password" required><button>Unlock</button></form>
      <p class="sub" id="ownmsg"></p></details>`
    : `
    <p style="margin:0"><b>Set up owner mode.</b> Choose a passcode so your watchlist is saved online, syncs across your devices and drives the daily AI briefs.
      Only someone with the passcode can change it. Pick something you don't use elsewhere (at least 6 characters).</p>
    <form id="claim"><input type="password" placeholder="Choose an owner passcode" autocomplete="new-password" minlength="6" required><button>Set passcode</button></form>
    <p class="sub" id="ownmsg"></p>`;
  $("#clear")?.addEventListener("click", () => { if (confirm("Remove every stock from your watchlist on this device?")) Watch.clear().then(render); });
  $("#lock")?.addEventListener("click", () => Watch.lock().then(() => { renderOwner(); render(); }));
  for (const [id, fn] of [["#unlock", Watch.unlock], ["#claim", Watch.claim]]) {
    $(id)?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = e.target.querySelector("input");
      try { await fn(input.value); input.value = ""; renderOwner(); render(); }
      catch (err) { $("#ownmsg").textContent = err.message; }
    });
  }
}

StockChat.mount($("#chat-market"), {
  name: "the market and my watchlist",
  data: () => ({ market: M, watchlist: Object.values(live).map((s) => ({ short: s.short, name: s.name, rating: s.rating, close: s.close, brief: BRIEFS[s.code]?.brief })) }),
  suggestions: ["What matters most for my stocks today?", "How does high oil affect Bursa?"],
});

Watch.load().then(() => { renderOwner(); render(); });
</script>
</body>
</html>
