<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bursa Watchlist</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #16191d; --muted: #5f6873; --line: #e3e6ea;
  --pos: #1a7f4b; --neg: #c0392b; --neu: #8a6d1d; --accent: #2457c5;
  --pos-bg: #e6f4ec; --neg-bg: #fbeaea; --neu-bg: #f8f1dc;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --card: #171b21; --text: #e7eaee; --muted: #98a2ad; --line: #2a3038;
    --pos: #3ccf85; --neg: #ff6b5e; --neu: #e0bd5a; --accent: #6d9bff;
    --pos-bg: #143024; --neg-bg: #3a1a18; --neu-bg: #33290f;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
header h1 { margin: 0; font-size: 24px; }
header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-top: 18px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; font-size: 13px; }
tr:last-child td { border-bottom: 0; }
.overview tr { cursor: pointer; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.Bullish, .Positive { color: var(--pos); background: var(--pos-bg); }
.Bearish, .Negative { color: var(--neg); background: var(--neg-bg); }
.Neutral, .Mixed { color: var(--neu); background: var(--neu-bg); }
.up { color: var(--pos); } .down { color: var(--neg); }
.stock-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; }
.stock-head h2 { margin: 0; font-size: 20px; }
.price { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sub { color: var(--muted); font-size: 13px; }
.chart { height: 340px; margin: 14px 0 4px; }
.legend { font-size: 12px; color: var(--muted); }
.legend span { margin-right: 14px; } .legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; margin-top: 14px; }
h3 { font-size: 15px; margin: 0 0 8px; }
ul.reasons { list-style: none; padding: 0; margin: 0; }
ul.reasons li { padding: 4px 0 4px 22px; position: relative; font-size: 14px; }
ul.reasons li::before { position: absolute; left: 0; font-weight: 700; }
ul.reasons li.p::before { content: "▲"; color: var(--pos); font-size: 11px; top: 7px; }
ul.reasons li.m::before { content: "▼"; color: var(--neg); font-size: 11px; top: 7px; }
ul.reasons li.e::before { content: "●"; color: var(--muted); font-size: 10px; top: 7px; }
details summary { cursor: pointer; color: var(--accent); font-size: 14px; margin-top: 14px; }
details p { font-size: 14px; color: var(--muted); }
.disclaimer { font-size: 12px; color: var(--muted); margin-top: 24px; }
@media (max-width: 600px) { .hide-sm { display: none; } .chart { height: 260px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bursa Watchlist</h1>
    <p id="gen"></p>
  </header>
  <div class="card">
    <table class="overview">
      <thead><tr><th>Stock</th><th>Price (RM)</th><th>Day</th><th>Rating</th><th class="hide-sm">Trend</th><th class="hide-sm">Valuation</th></tr></thead>
      <tbody id="ov"></tbody>
    </table>
  </div>
  <div id="stocks"></div>
  <p class="disclaimer">Signals are generated by rules from price and fundamental data (Yahoo Finance) for research only.
    They are not financial advice. Check Bursa announcements and the company's own reports before investing.</p>
</div>
<script>
const DATA = __DATA__;
const $ = (s) => document.querySelector(s);
const fmt = (v, d = 3) => v == null ? "–" : Number(v).toFixed(d);
const pct = (v) => v == null ? "–" : (v * 100).toFixed(1) + "%";
const big = (v) => v == null ? "–" : v >= 1e9 ? (v / 1e9).toFixed(2) + "B" : (v / 1e6).toFixed(1) + "M";
const sign = (v) => (v > 0 ? "+" : "") + v.toFixed(2) + "%";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cls = { "+": "p", "-": "m", "=": "e" };

$("#gen").textContent = `Updated ${DATA.generated} · prices as of ${DATA.stocks[0]?.as_of ?? "–"}`;

$("#ov").innerHTML = DATA.stocks.map((s) => `
  <tr onclick="document.getElementById('s-${s.code}').scrollIntoView({behavior:'smooth'})">
    <td><b>${esc(s.short)}</b> <span class="sub">${s.code}</span></td>
    <td>${fmt(s.close)}</td>
    <td class="${s.change_pct >= 0 ? "up" : "down"}">${sign(s.change_pct)}</td>
    <td><span class="badge ${s.rating}">${s.rating}</span></td>
    <td class="hide-sm"><span class="badge ${s.trend.label}">${s.trend.label}</span></td>
    <td class="hide-sm"><span class="badge ${s.valuation.label}">${s.valuation.label}</span></td>
  </tr>`).join("");

const reasons = (list) => `<ul class="reasons">${list.map(([k, t]) => `<li class="${cls[k]}">${esc(t)}</li>`).join("")}</ul>`;

$("#stocks").innerHTML = DATA.stocks.map((s) => {
  const L = s.levels, F = s.fundamentals, I = s.indicators;
  const annual = s.annual.filter((a) => a.revenue != null || a.net_income != null);
  return `
  <section class="card" id="s-${s.code}">
    <div class="stock-head">
      <h2>${esc(s.name)} <span class="sub">${esc(s.short)} · ${s.code}</span></h2>
      <span class="price">RM ${fmt(s.close)}</span>
      <span class="${s.change_pct >= 0 ? "up" : "down"}">${sign(s.change_pct)}</span>
      <span class="badge ${s.rating}">${s.rating}</span>
    </div>
    <div class="sub">${esc(s.sector)} · ${esc(s.industry)} · Market cap RM ${big(F.market_cap)}</div>
    <div class="chart" id="c-${s.code}"></div>
    <div class="legend"><span><i style="background:#f0a020"></i>50-day avg</span><span><i style="background:#7b61ff"></i>200-day avg</span></div>
    <div class="grid">
      <div><h3>Trend & momentum <span class="badge ${s.trend.label}">${s.trend.label}</span></h3>${reasons(s.trend.reasons)}</div>
      <div><h3>Valuation <span class="badge ${s.valuation.label}">${s.valuation.label}</span></h3>${reasons(s.valuation.reasons)}</div>
    </div>
    <div class="grid">
      <div><h3>Key levels (RM)</h3><table>
        <tr><td>3-month resistance</td><td>${fmt(L.resistance_3m)}</td></tr>
        <tr><td>3-month support</td><td>${fmt(L.support_3m)}</td></tr>
        <tr><td>50-day average</td><td>${fmt(L.sma50)}</td></tr>
        <tr><td>200-day average</td><td>${fmt(L.sma200)}</td></tr>
        <tr><td>52-week range</td><td>${fmt(L.low_52w)} – ${fmt(L.high_52w)}</td></tr>
      </table></div>
      <div><h3>Fundamentals</h3><table>
        <tr><td>P/E (trailing)</td><td>${fmt(F.pe, 1)}</td></tr>
        <tr><td>P/B</td><td>${fmt(F.pb, 2)}</td></tr>
        <tr><td>Dividend yield</td><td>${F.dividend_yield ? fmt(F.dividend_yield, 2) + "%" : "–"}</td></tr>
        <tr><td>ROE</td><td>${pct(F.roe)}</td></tr>
        <tr><td>Profit margin</td><td>${pct(F.profit_margin)}</td></tr>
        <tr><td>Debt / equity</td><td>${F.debt_to_equity == null ? "–" : fmt(F.debt_to_equity, 0) + "%"}</td></tr>
        <tr><td>RSI (14) · Volume vs 20d</td><td>${fmt(I.rsi, 0)} · ${fmt(I.vol_ratio, 1)}×</td></tr>
      </table></div>
    </div>
    ${annual.length ? `<h3 style="margin-top:18px">Annual results (RM)</h3><table>
      <tr><th>Year</th><th>Revenue</th><th>Net income</th></tr>
      ${annual.map((a) => `<tr><td>${a.year}</td><td>${big(a.revenue)}</td><td class="${a.net_income < 0 ? "down" : ""}">${big(a.net_income)}</td></tr>`).join("")}
    </table>` : ""}
    ${s.summary ? `<details><summary>About the business</summary><p>${esc(s.summary)}</p></details>` : ""}
  </section>`;
}).join("");

const dark = matchMedia("(prefers-color-scheme: dark)").matches;
const css = getComputedStyle(document.documentElement);
DATA.stocks.forEach((s) => {
  const el = document.getElementById(`c-${s.code}`);
  if (!window.LightweightCharts) { el.textContent = "Chart library failed to load (offline?)."; return; }
  const chart = LightweightCharts.createChart(el, {
    autoSize: true,
    layout: { background: { color: "transparent" }, textColor: css.getPropertyValue("--muted").trim() },
    grid: { vertLines: { visible: false }, horzLines: { color: css.getPropertyValue("--line").trim() } },
    rightPriceScale: { borderVisible: false }, timeScale: { borderVisible: false },
  });
  chart.addCandlestickSeries({
    upColor: css.getPropertyValue("--pos").trim(), downColor: css.getPropertyValue("--neg").trim(),
    wickUpColor: css.getPropertyValue("--pos").trim(), wickDownColor: css.getPropertyValue("--neg").trim(),
    borderVisible: false, priceFormat: { type: "price", precision: 3, minMove: 0.005 },
  }).setData(s.candles);
  chart.addLineSeries({ color: "#f0a020", lineWidth: 2, priceLineVisible: false, lastValueVisible: false }).setData(s.sma50);
  chart.addLineSeries({ color: "#7b61ff", lineWidth: 2, priceLineVisible: false, lastValueVisible: false }).setData(s.sma200);
  const from = s.candles[Math.max(0, s.candles.length - 260)].time;
  chart.timeScale().setVisibleRange({ from, to: s.candles[s.candles.length - 1].time });
});
</script>
</body>
</html>
